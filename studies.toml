note = "Decoded before exact masking: today's driver masks exactly, so a rerun differs from these records (README, Older runs)."

[[driver]]
key = "mechanism"
model = "meta-llama/Llama-3.1-8B-Instruct@0e9e39f249a16976918f6564b8830bc894c89659"
script = "mechanism.py"
args = "--rows data/ruler-fresh-4096/test.jsonl --per-task 10 --confirm raw/confirm_llama_0.jsonl raw/confirm_llama_1.jsonl raw/confirm_llama_2.jsonl raw/confirm_llama_3.jsonl"
out = "mechanism_llama.jsonl"
one_example = ""
note = "--confirm reads the confirmation run's raw records (it needs answers['full']), so run that driver first. No single-example option: the cheapest call is --per-task 1 (13 examples, one per task). Decoded before exact masking and before a later fix to Stage A's D: today's driver gives the corrected D (README, Older runs)."

[[driver]]
key = "mechanism"
model = "Qwen/Qwen3-8B@b968826d9c46dd6066d109eabc6255188de91218"
script = "mechanism.py"
args = "--rows data/ruler-fresh-4096/test.jsonl --per-task 10 --confirm raw/confirm_qwen3_0.jsonl raw/confirm_qwen3_1.jsonl raw/confirm_qwen3_2.jsonl raw/confirm_qwen3_3.jsonl"
