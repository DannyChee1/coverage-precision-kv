# Analyses (run.py verify/analyze) and GPU driver calls (run.py drive). @K is records/, @RAW raw/, @R results/, @OUT the

# output folder; braces expand like a shell in analyses and pairwise in drivers. Tier 1 needs this repository, tier 2

# also the rebuilt data, tier 3 also the drivers' raw records.



[[analysis]]
key = "controls"
paper = "Table 2 (8-page) / Table 1 (full), Figure A1"
tier = 1
args = "controls_analyze.py --model llama @K/controls_llama_{ruler_0,ruler_1,quality_0,quality_1,quality_2}.jsonl --model qwen3 @K/controls_qwen3_{ruler_0,ruler_1,quality_0,quality_1,quality_2}.jsonl --ruler-expected 338 --out @OUT/controls/results.json"
